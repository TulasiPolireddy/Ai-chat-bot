
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusAI - College Assistant</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="app">
        <aside class="sidebar">
            <h2>🎓 CampusAI</h2>
            <p>Your College Assistant</p>

            <button onclick="newChat()">+ New Chat</button>

            <h4>COLLEGE SERVICES</h4>
            <button onclick="askTopic('Admissions')">🎓 Admissions</button>
            <button onclick="askTopic('Placements')">💼 Placements & Jobs</button>
            <button onclick="askTopic('Academics')">📚 Academics</button>
            <button onclick="askTopic('Fees')">💰 Fees & Scholarships</button>
            <button onclick="askTopic('Hostel')">🏠 Campus & Hostel</button>
            <button onclick="askTopic('Career')">🚀 Career Guidance</button>
            <button onclick="askTopic('Events')">🎉 Events & Notices</button>
            <button onclick="showHelpdesk()">🛟 Student Helpdesk</button>
        </aside>

        <main class="chat-container">
            <header>
                <div>
                    <h3>College Virtual Assistant</h3>
                    <p>Ask me anything about your college!</p>
                </div>
                <span class="online">● Online</span>
            </header>

            <section class="chat-area" id="chatArea">
                <div class="welcome" id="welcome">
                    <div class="icon">🎓</div>
                    <h1>Hi there! 👋</h1>
                    <h2>How can I help you today?</h2>
                    <p>Choose a topic or type your question below.</p>

                    <div class="quick-options">
                        <button onclick="askTopic('Admissions')">
                            🎓 Admissions
                        </button>
                        <button onclick="askTopic('Placements')">
                            💼 Placements
                        </button>
                        <button onclick="askTopic('Scholarships')">
                            💰 Scholarships
                        </button>
                        <button onclick="askTopic('Exams')">
                            📅 Exams & Results
                        </button>
                        <button onclick="askTopic('Resume')">
                            📝 Resume Help
                        </button>
                        <button onclick="showHelpdesk()">
                            🛟 Raise a Query
                        </button>
                    </div>
                </div>

                <div id="messages"></div>
            </section>

            <div class="composer">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Ask anything about your college..."
                    autocomplete="off"
                >
                <button class="send" onclick="sendMessage()">➤</button>
            </div>

            <div class="footer">
                Verify important dates and fees with your college office.
                <button onclick="newChat()">Clear Chat</button>
            </div>
        </main>
    </div>

</body>
</html>
