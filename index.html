<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusAI | Smart Multilingual College Assistant</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-app-container">
        <!-- Sidebar Navigation Drawer -->
        <aside class="chat-sidebar" id="chatSidebar">
            <div class="brand">
                <div class="brand-logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h2>CampusAI</h2>
                    <span class="badge">4-Language AI Hub</span>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Campus Directory</h3>
                <div class="category-list">
                    <button class="cat-btn" onclick="sendQuickPrompt('Placement eligibility and company criteria')">
                        <i class="fa-solid fa-briefcase"></i> <span>Placements Hub</span>
                    </button>
                    <button class="cat-btn" onclick="sendQuickPrompt('College admission process and dates')">
                        <i class="fa-solid fa-school"></i> <span>Admissions</span>
                    </button>
                    <button class="cat-btn" onclick="sendQuickPrompt('Fee structure, deadlines and scholarships')">
                        <i class="fa-solid fa-indian-rupee-sign"></i> <span>Fees & Aid</span>
                    </button>
                    <button class="cat-btn" onclick="sendQuickPrompt('Hostel facilities, mess food and timings')">
                        <i class="fa-solid fa-hotel"></i> <span>Hostel & Campus</span>
                    </button>
                    <button class="cat-btn" onclick="sendQuickPrompt('Exam schedule, syllabus and attendance')">
                        <i class="fa-solid fa-book-open"></i> <span>Academics</span>
                    </button>
                    <button class="cat-btn" onclick="sendQuickPrompt('Career roadmaps, resume and skills guidance')">
                        <i class="fa-solid fa-compass"></i> <span>Career Guidance</span>
                    </button>
                    <button class="cat-btn" onclick="sendQuickPrompt('College events, technical and cultural fests')">
                        <i class="fa-solid fa-calendar-check"></i> <span>Events & Fests</span>
                    </button>
                    <button class="cat-btn" onclick="sendQuickPrompt('Recent circulars and notices')">
                        <i class="fa-solid fa-bullhorn"></i> <span>Notices</span>
                    </button>
                    <button class="cat-btn" onclick="sendQuickPrompt('Student services, bonafide and certificates')">
                        <i class="fa-solid fa-id-card"></i> <span>Student Services</span>
                    </button>
                </div>
            </div>

            <!-- College Emergency / Official Desk -->
            <div class="support-card">
                <div class="support-icon"><i class="fa-solid fa-headset"></i></div>
                <div>
                    <h4>Official Helpdesk</h4>
                    <p>Direct staff connection</p>
                    <button class="btn-support" onclick="triggerHandoff()"><i class="fa-solid fa-phone"></i> Contact Office</button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="mobile-toggle" id="menuToggle" aria-label="Toggle Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="status-indicator">
                        <span class="online-dot"></span>
                        <div>
                            <h3>CampusAI Assistant</h3>
                            <span class="subtext">Active • Always ready to help</span>
                        </div>
                    </div>
                </div>

                <div class="header-actions">
                    <!-- 4-Language Selector -->
                    <div class="lang-selector">
                        <i class="fa-solid fa-language"></i>
                        <select id="langSelect" onchange="changeLanguage()">
                            <option value="en">English</option>
                            <option value="te">తెలుగు (Telugu)</option>
                            <option value="hi">हिन्दी (Hindi)</option>
                            <option value="ta">தமிழ் (Tamil)</option>
                        </select>
                    </div>

                    <!-- Clear Chat -->
                    <button class="icon-btn" title="Reset Conversation" onclick="clearChat()">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Message Window -->
            <div class="chat-body" id="chatBody"></div>

            <!-- Quick Action Chips -->
            <div class="quick-chips" id="quickChips">
                <button class="chip" onclick="sendQuickPrompt('Placement eligibility and company criteria')">💼 Placement Cutoffs</button>
                <button class="chip" onclick="sendQuickPrompt('Fee structure, deadlines and scholarships')">💰 Fee Breakdown</button>
                <button class="chip" onclick="sendQuickPrompt('Hostel facilities, mess food and timings')">🏠 Hostel & Campus</button>
                <button class="chip" onclick="sendQuickPrompt('Admission process and dates')">📅 Admissions</button>
                <button class="chip" onclick="sendQuickPrompt('How can I get a Bonafide Certificate?')">📝 Bonafide Form</button>
                <button class="chip" onclick="sendQuickPrompt('Tell me a campus joke')">😄 Tell a Joke</button>
            </div>

            <!-- Chat Footer Input -->
            <footer class="chat-footer">
                <div class="input-wrapper">
                    <!-- File Upload Button -->
                    <label class="file-upload-btn" title="Upload circular or document">
                        <i class="fa-solid fa-paperclip"></i>
                        <input type="file" id="docUpload" accept=".pdf,.doc,.txt" onchange="handleFileUpload(event)">
                    </label>

                    <input type="text" id="userInput" placeholder="Ask anything about fees, hostel, placements, cutoffs..." autocomplete="off">
                    
                    <!-- Voice Mic Input -->
                    <button id="micBtn" class="action-btn" title="Voice Input" onclick="toggleSpeechRecognition()">
                        <i class="fa-solid fa-microphone"></i>
                    </button>

                    <!-- Send Button -->
                    <button id="sendBtn" class="send-btn" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
